<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f5f8f6"
>

<title>Entra nella Community WILDU</title>

<style>

  /* =========================================================
     BASE
     ========================================================= */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
      max(20px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));

    background:
      radial-gradient(
        circle at top,
        #ffffff 0%,
        #f8faf9 42%,
        #eef4f0 100%
      );

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    color: #243129;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }


  /* =========================================================
     CONTENITORE
     ========================================================= */

  .contenitore {
    width: 100%;
    max-width: 500px;

    text-align: center;
  }

  .card {
    width: 100%;

    padding: 30px 24px 24px;

    background: rgba(255, 255, 255, 0.96);

    border:
      1px solid
      rgba(36, 86, 56, 0.09);

    border-radius: 24px;

    box-shadow:
      0 14px 42px
      rgba(32, 74, 47, 0.09);
  }


  /* =========================================================
     LOGO WILDU
     ========================================================= */

  .logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 15px;
  }

  .logo-wildu {
    display: block;

    width: 68px;
    height: 68px;

    max-width: 100%;

    object-fit: contain;
  }


  /* =========================================================
     TESTI
     ========================================================= */

  h1 {
    margin: 0;

    font-size: 24px;
    line-height: 1.22;
    font-weight: 700;

    letter-spacing: -0.3px;

    color: #203128;
  }

  .intro {
    max-width: 390px;

    margin: 9px auto 23px;

    color: #67736c;

    font-size: 14.5px;
    line-height: 1.5;
  }


  /* =========================================================
     PULSANTE WHATSAPP
     ========================================================= */

  @keyframes respiro {

    0% {
      transform: scale(1);

      box-shadow:
        0 5px 17px
        rgba(37, 211, 102, 0.27);
    }

    50% {
      transform: scale(1.035);

      box-shadow:
        0 10px 24px
        rgba(37, 211, 102, 0.39);
    }

    100% {
      transform: scale(1);

      box-shadow:
        0 5px 17px
        rgba(37, 211, 102, 0.27);
    }

  }

  .pulsante-whatsapp {
    width: 100%;

    appearance: none;
    -webkit-appearance: none;

    border: none;

    padding: 16px 20px;

    border-radius: 999px;

    background: #25D366;
    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 11px;

    font-size: 16.5px;
    line-height: 1.2;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
      0 5px 17px
      rgba(37, 211, 102, 0.27);

    animation:
      respiro 2.2s
      infinite ease-in-out;

    transition:
      background-color 0.2s ease,
      transform 0.15s ease,
      box-shadow 0.2s ease;
  }

  .pulsante-whatsapp:hover {
    background: #20bd5a;
  }

  .pulsante-whatsapp:active {
    transform: scale(0.98);
    animation: none;
  }

  .pulsante-whatsapp:disabled {
    opacity: 0.78;

    cursor: default;

    animation: none;
  }

  .icona-wa {
    width: 25px;
    height: 25px;

    fill: currentColor;

    flex-shrink: 0;
  }


  /* =========================================================
     STATO
     ========================================================= */

  .stato {
    min-height: 18px;

    margin-top: 11px;

    color: #7a857e;

    font-size: 12px;
    line-height: 1.4;
  }


  /* =========================================================
     BOX INFORMATIVO
     ========================================================= */

  .info {
    margin-top: 17px;

    padding: 16px 16px 15px;

    background: #f6faf7;

    border:
      1px solid
      rgba(38, 100, 58, 0.06);

    border-radius: 15px;

    color: #56645b;

    font-size: 13.5px;
    line-height: 1.55;
  }

  .info strong {
    color: #31513b;
    font-weight: 700;
  }

  .nota-liberta {
    display: block;

    margin-top: 8px;

    color: #69766e;
  }


  /* =========================================================
     TORNA INDIETRO
     ========================================================= */

  .separatore {
    width: 58px;
    height: 1px;

    margin: 21px auto 14px;

    background: #e3e9e5;
  }

  .pulsante-indietro {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    padding: 8px 12px;

    border-radius: 9px;

    color: #657169;

    font-size: 14px;
    line-height: 1.3;
    font-weight: 600;

    text-decoration: none;

    transition:
      color 0.2s ease,
      background-color 0.2s ease;
  }

  .pulsante-indietro:hover {
    color: #315a3e;
    background: #f2f6f3;
  }

  .freccia {
    font-size: 17px;
    line-height: 1;
  }


  /* =========================================================
     RESPONSIVE
     ========================================================= */

  @media (max-width: 420px) {

    body {
      align-items: center;

      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    .card {
      padding: 26px 18px 20px;

      border-radius: 21px;
    }

    .logo-wildu {
      width: 62px;
      height: 62px;
    }

    h1 {
      font-size: 22px;
    }

    .intro {
      font-size: 14px;

      margin-bottom: 21px;
    }

    .pulsante-whatsapp {
      padding: 15px 17px;

      font-size: 15.5px;
    }

    .info {
      font-size: 13px;
    }

  }


  /* =========================================================
     ACCESSIBILITÀ
     ========================================================= */

  @media (prefers-reduced-motion: reduce) {

    .pulsante-whatsapp {
      animation: none;

      transition: none;
    }

  }

</style>
</head>


<body>

<div class="contenitore">

  <main class="card">

    <!-- =====================================================
         LOGO WILDU REALE
         ===================================================== -->

    <div class="logo-wrap">

      <img
        class="logo-wildu"
        src="https://res.cloudinary.com/daiyrgmbb/image/upload/v1773848193/icona_trasp_bocyr5.png"
        alt="WILDU"
      >

    </div>


    <!-- =====================================================
         TESTO
         ===================================================== -->

    <h1>
      Entra nella Community
    </h1>

    <p class="intro">
      Un ultimo passaggio e sei dei nostri.
    </p>


    <!-- =====================================================
         WHATSAPP
         ===================================================== -->

    <button
      id="pulsanteWhatsapp"
      class="pulsante-whatsapp"
      type="button"
    >

      <svg
        class="icona-wa"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
        />

      </svg>

      <span>
        PARTECIPA ALLA COMMUNITY
      </span>

    </button>


    <div
      id="stato"
      class="stato"
      aria-live="polite"
    ></div>


    <!-- =====================================================
         BENEFICI ESSENZIALI
         ===================================================== -->

    <div class="info">

      Una volta entrato potrai accedere a
      <strong>
        tutti gli eventi, compresi quelli gratuiti,
      </strong>
      oltre a materiali e giochi riservati alla community.

      <span class="nota-liberta">
        La community è ordinata e gestita:
        potrai sempre silenziarla o lasciarla quando vuoi.
      </span>

    </div>


    <!-- =====================================================
         TORNA ALLA HOME
         ===================================================== -->

    <div class="separatore"></div>

    <a
      class="pulsante-indietro"
      href="https://sites.google.com/view/trekking-eventi-gratis/home"
    >
      <span
        class="freccia"
        aria-hidden="true"
      >
        ←
      </span>

      Torna indietro
    </a>

  </main>

</div>


<script>

(function () {

  "use strict";


  /* =========================================================
     URL REALI
     ========================================================= */

  const LINK_WHATSAPP =
    "https://chat.whatsapp.com/I9X4C4mA7lfI0BU7ljgGYw";

  const PAGINA_BENVENUTO =
    "https://sites.google.com/view/trekking-eventi-gratis/benvenuto";


  /* =========================================================
     CONFIGURAZIONE INTERNA
     ========================================================= */

  const STORAGE_KEY =
    "wildu_community_whatsapp_redirect_v4";

  const DURATA_MARKER_MS =
    15 * 60 * 1000;


  const pulsante =
    document.getElementById("pulsanteWhatsapp");

  const stato =
    document.getElementById("stato");


  let aperturaInCorso = false;

  let paginaDiventataNascosta = false;

  let redirectEseguito = false;


  /* =========================================================
     RILEVAMENTO MOBILE / TABLET
     ========================================================= */

  function dispositivoMobileOTablet() {

    const userAgent =
      navigator.userAgent || "";


    /*
     * iPhone / iPad / Android classici.
     */

    if (
      /Android|iPhone|iPad|iPod/i.test(userAgent)
    ) {

      return true;

    }


    /*
     * iPadOS moderno può presentarsi come Macintosh.
     *
     * Il controllo touch evita normalmente di confonderlo
     * con un Mac desktop tradizionale.
     */

    if (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    ) {

      return true;

    }


    return false;

  }


  /* =========================================================
     STORAGE
     ========================================================= */

  function salvaMarker() {

    try {

      sessionStorage.setItem(
        STORAGE_KEY,
        String(Date.now())
      );

    } catch (errore) {

      /*
       * Alcune WebView o modalità privacy possono limitare
       * sessionStorage.
       *
       * La navigazione verso WhatsApp continua comunque.
       */

    }

  }


  function leggiMarker() {

    try {

      const valore =
        sessionStorage.getItem(STORAGE_KEY);


      if (!valore) {

        return null;

      }


      const timestamp =
        Number(valore);


      if (!Number.isFinite(timestamp)) {

        sessionStorage.removeItem(STORAGE_KEY);

        return null;

      }


      /*
       * Un marker vecchio non deve provocare redirect
       * molto tempo dopo.
       */

      if (
        Date.now() - timestamp >
        DURATA_MARKER_MS
      ) {

        sessionStorage.removeItem(STORAGE_KEY);

        return null;

      }


      return timestamp;

    } catch (errore) {

      return null;

    }

  }


  function cancellaMarker() {

    try {

      sessionStorage.removeItem(STORAGE_KEY);

    } catch (errore) {

      /*
       * Nessuna azione necessaria.
       */

    }

  }


  /* =========================================================
     REDIRECT FINALE
     ========================================================= */

  function vaiAllaPaginaBenvenuto() {

    if (redirectEseguito) {

      return;

    }


    redirectEseguito = true;


    cancellaMarker();


    /*
     * replace() evita di lasciare la pagina ponte
     * nella cronologia immediatamente precedente.
     *
     * In questo modo il pulsante "indietro" del browser
     * ha meno probabilità di creare un loop.
     */

    window.location.replace(
      PAGINA_BENVENUTO
    );

  }


  /* =========================================================
     STRATEGIA MOBILE
     ========================================================= */

  function aperturaMobile() {

    aperturaInCorso = true;

    paginaDiventataNascosta = false;


    salvaMarker();


    stato.textContent =
      "Apertura di WhatsApp…";


    /*
     * Su mobile NON utilizziamo:
     *
     * window.open()
     * target="_blank"
     *
     * Questo evita la strategia più problematica
     * soprattutto su iPhone / iPad quando WhatsApp
     * viene aperto come applicazione esterna.
     */

    window.location.assign(
      LINK_WHATSAPP
    );

  }


  /* =========================================================
     STRATEGIA DESKTOP
     ========================================================= */

  function aperturaDesktop() {

    /*
     * window.open viene eseguito direttamente all'interno
     * del gesto dell'utente.
     *
     * Non viene eseguito dentro setTimeout.
     */

    const schedaWhatsApp =
      window.open(
        LINK_WHATSAPP,
        "_blank"
      );


    /*
     * Se la nuova scheda è stata creata correttamente,
     * questa scheda può diventare la pagina Benvenuto.
     */

    if (schedaWhatsApp) {

      /*
       * Protezione tab-opener.
       *
       * Usiamo try/catch perché browser differenti possono
       * gestire la proprietà opener in modo diverso.
       */

      try {

        schedaWhatsApp.opener = null;

      } catch (errore) {

        /*
         * Nessuna azione necessaria.
         */

      }


      stato.textContent =
        "Apertura della community…";


      window.setTimeout(
        vaiAllaPaginaBenvenuto,
        150
      );


      return;

    }


    /*
     * Se il popup è stato bloccato:
     *
     * niente errore per l'utente.
     * Passiamo alla strategia sicura nella stessa scheda.
     */

    aperturaMobile();

  }


  /* =========================================================
     CLICK PRINCIPALE
     ========================================================= */

  pulsante.addEventListener(
    "click",
    function () {

      if (aperturaInCorso) {

        return;

      }


      aperturaInCorso = true;

      pulsante.disabled = true;


      if (dispositivoMobileOTablet()) {

        aperturaMobile();

      } else {

        aperturaDesktop();

      }

    }
  );


  /* =========================================================
     RITORNO DALL'APP WHATSAPP
     ========================================================= */

  document.addEventListener(
    "visibilitychange",
    function () {

      /*
       * Sequenza tipica:
       *
       * pagina visibile
       *      ↓
       * pagina hidden
       *      ↓
       * WhatsApp
       *      ↓
       * ritorno al browser
       *      ↓
       * pagina visible
       *
       * Il redirect a Benvenuto avviene solo dopo
       * che sappiamo che la pagina era realmente nascosta.
       */

      if (
        document.visibilityState === "hidden"
      ) {

        if (
          aperturaInCorso ||
          leggiMarker()
        ) {

          paginaDiventataNascosta = true;

        }


        return;

      }


      if (
        document.visibilityState === "visible" &&
        paginaDiventataNascosta &&
        leggiMarker()
      ) {

        vaiAllaPaginaBenvenuto();

      }

    }
  );


  /* =========================================================
     SAFARI / BACK-FORWARD CACHE
     ========================================================= */

  window.addEventListener(
    "pageshow",
    function (evento) {

      /*
       * Safari usa spesso il BFCache.
       *
       * Se la pagina viene ripristinata dalla cache
       * dopo l'apertura di WhatsApp, questo evento
       * offre un secondo percorso affidabile.
       */

      if (
        evento.persisted &&
        leggiMarker()
      ) {

        vaiAllaPaginaBenvenuto();

      }

    }
  );


  /* =========================================================
     FALLBACK FOCUS
     ========================================================= */

  window.addEventListener(
    "focus",
    function () {

      /*
       * Alcuni browser / WebView producono visibilitychange
       * in modo differente.
       *
       * Utilizziamo focus soltanto se sappiamo che la pagina
       * era effettivamente diventata nascosta.
       */

      if (
        paginaDiventataNascosta &&
        leggiMarker()
      ) {

        vaiAllaPaginaBenvenuto();

      }

    }
  );


  /* =========================================================
     RITORNO MANUALE DAL SITO WHATSAPP!
     ========================================================= */

  const markerEsistente =
    leggiMarker();


  if (markerEsistente) {

    const etaMarker =
      Date.now() - markerEsistente;


    /*
     * Evitiamo che il marker appena creato causi un redirect
     * immediato durante il primo click.
     */

    if (etaMarker > 1000) {

      window.setTimeout(
        function () {

          if (
            document.visibilityState === "visible" &&
            leggiMarker()
          ) {

            vaiAllaPaginaBenvenuto();

          }

        },
        150
      );

    }

  }


})();

</script>

</body>
</html>
